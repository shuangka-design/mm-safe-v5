name: Build Android APK (Safe Mode v7 - Pure Java)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          V7_APP_GRADLE=$(grep -rl "versionCode = 7" . | head -n 1)
          if [ -n "$V7_APP_GRADLE" ]; then
            PROJECT_ROOT=$(dirname $(dirname "$V7_APP_GRADLE"))
            echo "Found v7 project root at: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
          fi
          find . -name "*.kt" -type f -delete
          gradle assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-AutoBridge-SafeMode-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
