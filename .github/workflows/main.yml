name: Build Android APK (Auto-Generate Clean Project)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Clean Android Project & Build APK
        run: |
          mkdir -p /tmp/clean_mm/app/src/main/java/com/example/mmbridge
          cd /tmp/clean_mm

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MoneyManagerAutoBridge"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.mmbridge"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mmbridge"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 9
                  versionName = "9.0-SafeMode"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <package android:name="com.realbyteapps.moneymanagerfree" />
                  <package android:name="com.realbyteapps.moneymanager" />
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="MM AutoBridge (Safe)"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".QuickBridgeActivity"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:exported="false" />
                  <service
                      android:name=".BankNotificationService"
                      android:label="MM Bank Notification Reader"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/TransactionItem.java
          package com.example.mmbridge;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          public class TransactionItem {
              public final String bankName;
              public final String amount;
              public final String note;
              public final String dateStr;
              public TransactionItem(String bankName, String amount, String note) {
                  this.bankName = bankName;
                  this.amount = amount;
                  this.note = note;
                  this.dateStr = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(new Date());
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/TransactionQueue.java
          package com.example.mmbridge;
          import android.content.Context;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          public class TransactionQueue {
              public static final List<String> historyLogs = new ArrayList<>();
              public static void addTransaction(Context context, TransactionItem item) {
                  addLog("พบรายจ่าย " + item.bankName + ": " + item.amount + " บ. (" + item.note + ")");
                  SharedPreferences prefs = context.getSharedPreferences("mm_bridge_history", Context.MODE_PRIVATE);
                  String existing = prefs.getString("tsv_rows", "");
                  if (existing == null) existing = "";
                  String newRow = item.dateStr + "\t" + item.bankName + "\tอาหาร/ทั่วไป\t\t" + item.note + "\t" + item.amount + "\tExpense\t";
                  String updated = existing.isEmpty() ? newRow : existing + "\n" + newRow;
                  prefs.edit().putString("tsv_rows", updated).apply();
              }
              public static void addLog(String msg) {
                  String time = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                  historyLogs.add(0, "[" + time + "] " + msg);
                  if (historyLogs.size() > 50) historyLogs.remove(historyLogs.size() - 1);
              }
              public static String exportTsvContent(Context context) {
                  SharedPreferences prefs = context.getSharedPreferences("mm_bridge_history", Context.MODE_PRIVATE);
                  String rows = prefs.getString("tsv_rows", "");
                  if (rows == null) rows = "";
                  String header = "Date\tAccount\tCategory\tSubcategory\tNote\tAmount\tIncome/Expense\tDescription";
                  return rows.isEmpty() ? header : header + "\n" + rows;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/ThaiBankParser.java
          package com.example.mmbridge;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class ThaiBankParser {
              public static final Map<String, String> SUPPORTED_PACKAGES = new HashMap<>();
              static {
                  SUPPORTED_PACKAGES.put("ktbcs.netbank", "กรุงไทย (KTB)");
                  SUPPORTED_PACKAGES.put("com.bangkokbank.mobilebanking", "กรุงเทพ (BBL)");
                  SUPPORTED_PACKAGES.put("com.krungsri.kma", "กรุงศรี (KMA)");
                  SUPPORTED_PACKAGES.put("com.gsb.mymo", "ออมสิน (MyMo)");
                  SUPPORTED_PACKAGES.put("th.co.truemoney.wallet", "TrueMoney");
              }
              private static final Pattern[] AMOUNT_PATTERNS = new Pattern[]{
                  Pattern.compile("([0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{2}))\\s*(?:บาท|บ\\.|THB)", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("(?:จำนวน|ยอดเงิน|ชำระ|โอน|THB)\\s*([0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{2}))", Pattern.CASE_INSENSITIVE),
                  Pattern.compile("([0-9]+(?:\\.[0-9]{2}))\\s*(?:บาท|THB)", Pattern.CASE_INSENSITIVE)
              };
              public static TransactionItem parseNotification(String packageName, String title, String text) {
                  String bankName = SUPPORTED_PACKAGES.get(packageName);
                  if (bankName == null) return null;
                  String fullMessage = (title != null ? title : "") + " " + (text != null ? text : "");
                  String lower = fullMessage.toLowerCase();
                  if (lower.contains("เงินเข้า") || lower.contains("otp") || lower.contains("รหัสอ้างอิง")) return null;
                  String extractedAmount = null;
                  for (Pattern pat : AMOUNT_PATTERNS) {
                      Matcher m = pat.matcher(fullMessage);
                      if (m.find()) {
                          extractedAmount = m.group(1).replace(",", "");
                          break;
                      }
                  }
                  if (extractedAmount == null) return null;
                  String cleanText = text != null ? text.replace("\n", " ") : "";
                  if (cleanText.length() > 40) cleanText = cleanText.substring(0, 40);
                  return new TransactionItem(bankName, extractedAmount, bankName + ": " + cleanText);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/QuickBridgeActivity.java
          package com.example.mmbridge;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;
          public class QuickBridgeActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  String amount = getIntent().getStringExtra("EXTRA_AMOUNT");
                  String bankName = getIntent().getStringExtra("EXTRA_BANK");
                  if (amount == null) amount = "";
                  if (bankName == null) bankName = "";
                  if (!amount.isEmpty()) {
                      ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cb != null) cb.setPrimaryClip(ClipData.newPlainText("MM_Amount", amount));
                      Toast.makeText(this, "คัดลอกยอด " + amount + " บ. (" + bankName + ") แล้ว! กดวางในแอปหมูแดงได้เลย", Toast.LENGTH_LONG).show();
                  }
                  Intent launch = getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanagerfree");
                  if (launch == null) launch = getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanager");
                  if (launch != null) {
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      startActivity(launch);
                  } else {
                      Toast.makeText(this, "ไม่พบแอป Money Manager ในเครื่อง", Toast.LENGTH_SHORT).show();
                  }
                  finish();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/BankNotificationService.java
          package com.example.mmbridge;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          public class BankNotificationService extends NotificationListenerService {
              private long lastTriggerTime = 0L;
              private static final String CHANNEL_ID = "mm_safe_bridge_channel";
              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "MM Bridge", NotificationManager.IMPORTANCE_HIGH);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null) return;
                  String pkg = sbn.getPackageName();
                  if (pkg == null || !ThaiBankParser.SUPPORTED_PACKAGES.containsKey(pkg)) return;
                  Bundle extras = sbn.getNotification().extras;
                  if (extras == null) return;
                  CharSequence t1 = extras.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence t2 = extras.getCharSequence(Notification.EXTRA_TEXT);
                  if (t2 == null) t2 = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  TransactionItem item = ThaiBankParser.parseNotification(pkg, t1 != null ? t1.toString() : "", t2 != null ? t2.toString() : "");
                  if (item != null) {
                      long now = System.currentTimeMillis();
                      if (now - lastTriggerTime < 4000) return;
                      lastTriggerTime = now;
                      TransactionQueue.addTransaction(this, item);
                      try {
                          ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cb != null) cb.setPrimaryClip(ClipData.newPlainText("amount", item.amount));
                      } catch (Exception ignored) {}
                      Intent bridgeIntent = new Intent(this, QuickBridgeActivity.class);
                      bridgeIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                      bridgeIntent.putExtra("EXTRA_AMOUNT", item.amount);
                      bridgeIntent.putExtra("EXTRA_BANK", item.bankName);
                      PendingIntent pi = PendingIntent.getActivity(this, (int)(now % 10000), bridgeIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
                      Notification notif = b.setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentTitle("จ่ายผ่าน " + item.bankName + ": " + item.amount + " บาท")
                          .setContentText("แตะเพื่อคัดลอกยอด " + item.amount + " บ. และเปิดแอปหมูแดง")
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build();
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(888, notif);
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mmbridge/MainActivity.java
          package com.example.mmbridge;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          public class MainActivity extends Activity {
              private TextView logTextView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 48, 48, 48);
                  TextView title = new TextView(this);
                  title.setText("MM AutoBridge (Safe Mode 100%)\nไร้ AccessibilityService ไม่กระทบแอปธนาคาร\n(กรุงไทย, กรุงเทพ, กรุงศรี, ออมสิน, TrueMoney)");
                  title.setTextSize(17f);
                  title.setPadding(0, 0, 0, 32);
                  root.addView(title);
                  Button b1 = new Button(this);
                  b1.setText("1. เปิดสิทธิ์อ่านแจ้งเตือนธนาคาร (Notification)");
                  b1.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)));
                  root.addView(b1);
                  Button b2 = new Button(this);
                  b2.setText("2. อนุญาตให้แอปส่งแจ้งเตือนปุ่มด่วน");
                  b2.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      } else {
                          Toast.makeText(this, "พร้อมใช้งานแล้ว!", Toast.LENGTH_SHORT).show();
                      }
                  });
                  root.addView(b2);
                  Button b3 = new Button(this);
                  b3.setText("ทดสอบคัดลอกยอด 150.00 บ. & เปิดแอปหมูแดง");
                  b3.setOnClickListener(v -> {
                      TransactionItem test = new TransactionItem("กรุงไทย (KTB)", "150.00", "ทดสอบสแกนจ่าย");
                      TransactionQueue.addTransaction(MainActivity.this, test);
                      refreshLogs();
                      Intent i = new Intent(MainActivity.this, QuickBridgeActivity.class);
                      i.putExtra("EXTRA_AMOUNT", test.amount);
                      i.putExtra("EXTRA_BANK", test.bankName);
                      startActivity(i);
                  });
                  root.addView(b3);
                  Button b4 = new Button(this);
                  b4.setText("สร้างไฟล์ .xls (สำหรับ Import เข้าแอปหมูแดงทีเดียว)");
                  b4.setOnClickListener(v -> {
                      try {
                          String content = TransactionQueue.exportTsvContent(this);
                          File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          File f = new File(dir, "MoneyManager_AutoImport.xls");
                          try (FileOutputStream fos = new FileOutputStream(f)) {
                              fos.write(content.getBytes(StandardCharsets.UTF_8));
                          }
                          Toast.makeText(this, "บันทึกไฟล์ที่ Download/MoneyManager_AutoImport.xls แล้ว!", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "ผิดพลาด: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  });
                  root.addView(b4);
                  logTextView = new TextView(this);
                  logTextView.setText("ประวัติการทำงาน:\n- ยังไม่มีรายการ");
                  logTextView.setPadding(0, 32, 0, 0);
                  ScrollView sv = new ScrollView(this);
                  sv.addView(logTextView);
                  root.addView(sv);
                  setContentView(root);
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  refreshLogs();
              }
              private void refreshLogs() {
                  if (!TransactionQueue.historyLogs.isEmpty()) {
                      StringBuilder sb = new StringBuilder("ประวัติรายการล่าสุด:\n");
                      for (String s : TransactionQueue.historyLogs) sb.append(s).append("\n");
                      logTextView.setText(sb.toString());
                  }
              }
          }
          EOF

          gradle assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-AutoBridge-SafeMode-APK
          path: /tmp/clean_mm/app/build/outputs/apk/debug/app-debug.apk
