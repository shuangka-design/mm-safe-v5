name: Build Android APK (Safe Mode v5)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%T@ %h\n" | sort -nr | head -n 1 | awk '{print $2}')
          if [ -n "$TARGET_DIR" ]; then
            echo "Building project in: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          gradle assembleDebug --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-AutoBridge-SafeMode-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
